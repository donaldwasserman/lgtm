name: review-complexity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Re-evaluates on approval so the check clears itself. ready_for_review is
  # needed because a draft going up for review does not fire synchronize.
  pull_request_review:
    types: [submitted, dismissed]

# checks: write publishes the check run; pull-requests: write covers labelling
# and reading reviews.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lgtm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On pull_request_review the default ref is the base branch, so
          # without this the action would analyze the wrong tree.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch base branch
        env:
          # GITHUB_BASE_REF is not set on pull_request_review.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "$BASE_REF"
      # The gate runs the image built from this PR, just as `uses: ./` runs
      # this PR's action.yml, so a change to the report contract is judged by
      # the code that defines it. Consumers use the published image instead.
      - uses: docker/setup-buildx-action@v3
      # continue-on-error: a failed build must still reach the action, whose
      # pull step then fails and publishes an "Analysis failed" check. Stopping
      # here would post no check at all and block the PR on a required check.
      - uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          context: .
          load: true
          tags: lgtm:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: ./
        with:
          image: lgtm:pr
          base-ref: origin/${{ github.event.pull_request.base.ref }}
          theta-depth: '7'
          theta-breadth: '6'
          epsilon-trivial: '1'
          # Deliberately 'none' for this repo. Any ranking mode would exempt
          # the top contributor, who writes nearly every PR here, so the gate
          # would never fire on its own repository. Set trust-mode to
          # 'codeowners' (or a ranking mode) on a repo with several active
          # contributors; see "Trust modes" in docs/action.md.
          trust-mode: 'none'
          check-name: 'LGTM / review-gate'
          label: 'needs-review'
