name: review-complexity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Re-evaluates on approval so the check clears itself. ready_for_review is
  # needed because a draft going up for review does not fire synchronize.
  pull_request_review:
    types: [submitted, dismissed]

# checks: write publishes the check run; pull-requests: write covers labelling
# and reading reviews.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lgtm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On pull_request_review the default ref is the base branch, so
          # without this the action would analyze the wrong tree.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Determine merge base
        id: base
        env:
          # GITHUB_BASE_REF is not set on pull_request_review.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          echo "ref=$(git merge-base "origin/$BASE_REF" HEAD)" >> "$GITHUB_OUTPUT"
      - name: Extract base tree
        run: |
          mkdir -p "$RUNNER_TEMP/lgtm/base"
          git archive "${{ steps.base.outputs.ref }}" | tar -x -C "$RUNNER_TEMP/lgtm/base"
      - uses: ./
        with:
          base: ${{ runner.temp }}/lgtm/base
          head: ${{ github.workspace }}
          theta-depth: '7'
          theta-breadth: '6'
          epsilon-trivial: '1'
          # Deliberately 'none' for this repo. Any ranking mode would exempt
          # the top contributor, who writes nearly every PR here, so the gate
          # would never fire on its own repository. Set trust-mode to
          # 'codeowners' (or a ranking mode) on a repo with several active
          # contributors; see "Trust modes" in the README.
          trust-mode: 'none'
          check-name: 'LGTM / review-gate'
          label: 'needs-review'
