name: 'LGTM Review Gate'
description: 'Flags pull requests that need a human review, and blocks them until someone approves.'
author: 'Donald Wasserman'
branding:
  icon: 'check-circle'
  color: 'green'
inputs:
  base-ref:
    description: >-
      Git ref the pull request targets, such as "origin/main". lgtm diffs the
      head commit against its merge base with this ref, so the checkout needs
      full history (fetch-depth 0) and the ref fetched. Use this or
      "base"/"head", not both.
    required: false
    default: ''
  head-ref:
    description: 'Git ref of the change itself, used with "base-ref".'
    required: false
    default: 'HEAD'
  repo:
    description: >-
      Path to the git checkout used with "base-ref". Defaults to the
      github.workspace path. Must be an already-resolved path; see "base".
    required: false
    default: ''
  base:
    description: >-
      Path to the base (pre-PR) source tree, for directory mode. Must be an
      already-resolved path: use the runner.temp expression rather than
      "$RUNNER_TEMP/...", as the value is passed to the tool verbatim and is
      not expanded by a shell. (Descriptions must not contain expression
      syntax: the runner evaluates it here too, and rejects the whole action if
      it does.)
    required: false
    default: ''
  head:
    description: >-
      Path to the head (post-PR) source tree, for directory mode, normally the
      github.workspace path. Must be an already-resolved path; see "base".
    required: false
    default: ''
  image:
    description: >-
      The lgtm container image that evaluates the change. Empty picks the image
      matching this action's version: a release tag (v1, v1.2.3) uses that
      release's image, a commit SHA uses the image built from that commit, and
      anything else uses the "main" image. The action pulls it unless it is
      already present locally, so a workflow can build its own and pass the
      local tag.
    required: false
    default: ''
  preset:
    description: >-
      Gate to start from, "balanced" or "strict". Empty uses the preset in
      .lgtm.yml, or balanced when there is none.
    required: false
    default: ''
  theta-depth:
    description: 'Edit depth at which review is required, or "off". Empty uses the preset, which leaves it off.'
    required: false
    default: ''
  theta-breadth:
    description: 'Non-test files with a substantive change at which review is required, or "off". Empty uses the preset.'
    required: false
    default: ''
  theta-modules:
    description: 'Packages those files belong to at which review is required, or "off". Empty uses the preset.'
    required: false
    default: ''
  theta-lines:
    description: 'Non-blank lines added to non-test source files at which review is required, or "off". Empty uses the preset.'
    required: false
    default: ''
  theta-uncovered:
    description: >-
      Changed files no measure can look at (and uncovered-ignore in .lgtm.yml
      does not list) at which review is required, or "off". Empty uses the
      preset.
    required: false
    default: ''
  theta-cog:
    description: >-
      Increase in one existing function's cognitive complexity at which
      review is required, or "off". Empty uses the preset.
    required: false
    default: ''
  theta-new-function:
    description: 'Cognitive complexity of one new function at which review is required, or "off". Empty uses the preset.'
    required: false
    default: ''
  theta-significance:
    description: >-
      Significance level (low, medium, high, crucial) at which review is
      required, or "off". While on, an exported signature change to a symbol
      that something calls also requires review. Empty uses the preset.
    required: false
    default: ''
  theta-blast:
    description: 'Blast radius (callers within 3 hops of changed symbols) at which review is required, or "off". Empty uses the preset.'
    required: false
    default: ''
  exclude:
    description: >-
      Globs of paths to leave out of the scan, one per line, relative to the
      repository root (e.g. "**/*.pb.go"). A pattern without a slash matches
      at any depth; "**" spans directories; "!entry" removes a built-in entry
      such as "!build".
    required: false
    default: ''
  check-name:
    description: >-
      Name of the check run this action publishes. This is the exact string you
      mark as a required status check in branch protection, so renaming it
      silently un-requires the old one. Empty disables publishing the check.
    required: false
    default: 'LGTM / review-gate'
  label:
    description: >-
      Label to add to the pull request when review is required, and to remove
      when it is not. Routing only - the merge gate is the check run. Empty
      disables labelling.
    required: false
    default: ''
  request-reviewers:
    description: >-
      Comma-separated reviewers to request when review is required. A plain
      login requests a user; "org/team" requests a team.
    required: false
    default: ''
  github-token:
    description: >-
      Token used to publish the check run, read reviews, label the PR and
      request reviewers. Needs checks: write and pull-requests: write.
    required: false
    default: ${{ github.token }}

outputs:
  requires-review:
    description: >-
      '"true" when the change requires human review, "false" otherwise. Empty
      when lgtm could not run - test for "true" explicitly, since an empty
      value compared against "false" reads as "not required".'
    value: ${{ steps.evaluate.outputs.requires-review }}
  check-conclusion:
    description: >-
      '"success" or "failure" - the conclusion published to the check run. It is
      "failure" both when review is required without approval and when lgtm
      itself failed. Empty when no check was published: outside a pull request,
      or with check-name disabled.'
    value: ${{ steps.check.outputs.conclusion }}
  report:
    description: 'The full lgtm JSON report. Empty when lgtm could not run.'
    value: ${{ steps.evaluate.outputs.report }}

runs:
  using: 'composite'
  steps:
    # Picks the image, then pulls it up front so a registry failure is
    # reported as such, rather than surfacing as an exit code from
    # `docker run` that reads like an lgtm crash.
    - name: 'Pull lgtm image'
      id: image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -uo pipefail
        if [ -z "$IMAGE" ]; then
          # The runner checks remote actions out to .../<owner>/<repo>/<ref>,
          # so the path says which ref the caller asked for. github.action_ref
          # would say the same, but it is unreliable inside composite actions.
          ref=$(basename "$GITHUB_ACTION_PATH")
          version=$(tr -d '[:space:]' < "$GITHUB_ACTION_PATH/VERSION" 2>/dev/null || true)
          if [ -n "$version" ] && { [ "$ref" = "v$version" ] || [ "$ref" = "v${version%%.*}" ]; }; then
            tag="$version"                  # a release: @v1.2.3 or @v1
          elif [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            tag="sha-${ref:0:7}"            # pinned to a commit: publish.yml tags every main commit
          else
            tag=main                        # a branch, or uses: ./
          fi
          IMAGE="ghcr.io/donaldwasserman/lgtm:$tag"
        fi
        # Recorded before pulling, so the evaluate step names the image even
        # when the pull fails.
        echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"

        if docker image inspect "$IMAGE" >/dev/null 2>&1; then
          echo "using local image $IMAGE"
        else
          docker pull "$IMAGE"
        fi

    # Records the decision without ever exiting non-zero, so the check run is
    # still published when lgtm fails. The job's own failure is decided by the
    # final step instead.
    - name: 'Evaluate review complexity'
      id: evaluate
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.ref }}
        LGTM_BASE_REF: ${{ inputs.base-ref }}
        LGTM_HEAD_REF: ${{ inputs.head-ref }}
        LGTM_REPO: ${{ inputs.repo || github.workspace }}
        LGTM_BASE: ${{ inputs.base }}
        LGTM_HEAD: ${{ inputs.head }}
        LGTM_PRESET: ${{ inputs.preset }}
        LGTM_THETA_DEPTH: ${{ inputs.theta-depth }}
        LGTM_THETA_BREADTH: ${{ inputs.theta-breadth }}
        LGTM_THETA_MODULES: ${{ inputs.theta-modules }}
        LGTM_THETA_LINES: ${{ inputs.theta-lines }}
        LGTM_THETA_UNCOVERED: ${{ inputs.theta-uncovered }}
        LGTM_THETA_COG: ${{ inputs.theta-cog }}
        LGTM_THETA_NEW_FUNCTION: ${{ inputs.theta-new-function }}
        LGTM_THETA_SIGNIFICANCE: ${{ inputs.theta-significance }}
        LGTM_THETA_BLAST: ${{ inputs.theta-blast }}
        LGTM_EXCLUDE: ${{ inputs.exclude }}
      run: |
        set -uo pipefail

        # Inputs are mounted read-only at fixed paths; the container sees
        # nothing else of the runner. It runs as the runner's uid so it can
        # write the report into RUNNER_TEMP.
        args=(docker run --rm --network none --user "$(id -u):$(id -g)"
              -v "$RUNNER_TEMP:/out")
        mode=''
        if [ -n "$LGTM_BASE_REF" ] && [ -z "$LGTM_BASE$LGTM_HEAD" ]; then
          mode=git
          args+=(-v "$LGTM_REPO:/repo:ro" "$IMAGE"
                 --repo /repo --base-ref "$LGTM_BASE_REF" --head-ref "$LGTM_HEAD_REF")
        elif [ -z "$LGTM_BASE_REF" ] && [ -n "$LGTM_BASE" ] && [ -n "$LGTM_HEAD" ]; then
          mode=dirs
          args+=(-v "$LGTM_BASE:/trees/base:ro" -v "$LGTM_HEAD:/trees/head:ro" "$IMAGE"
                 --base /trees/base --head /trees/head)
        fi

        # One --exclude per non-blank line of the input.
        excludes=()
        while IFS= read -r pat; do
          [ -n "${pat//[[:space:]]/}" ] && excludes+=(--exclude "$pat")
        done <<< "$LGTM_EXCLUDE"

        # Only what the workflow set: anything else comes from .lgtm.yml in
        # the base tree, or the preset.
        settings=()
        [ -n "$LGTM_PRESET" ] && settings+=(--preset "$LGTM_PRESET")
        for pair in "depth=$LGTM_THETA_DEPTH" "breadth=$LGTM_THETA_BREADTH" \
                    "modules=$LGTM_THETA_MODULES" "lines=$LGTM_THETA_LINES" \
                    "uncovered=$LGTM_THETA_UNCOVERED" "cog=$LGTM_THETA_COG" \
                    "new-function=$LGTM_THETA_NEW_FUNCTION" \
                    "significance=$LGTM_THETA_SIGNIFICANCE" "blast=$LGTM_THETA_BLAST"; do
          [ -n "${pair#*=}" ] && settings+=("--theta-${pair%%=*}" "${pair#*=}")
        done

        report="$RUNNER_TEMP/lgtm-report.json"
        rm -f "$report"
        if [ -z "$mode" ]; then
          echo "::error::set either base-ref, or both base and head"
          code=2
        else
          "${args[@]}" \
            --output /out/lgtm-report.json \
            "${settings[@]+"${settings[@]}"}" \
            "${excludes[@]+"${excludes[@]}"}" && code=0 || code=$?
        fi

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        # The verdict is read from the report, and must agree with the exit
        # code. Either one missing or out of step means no verdict: claiming
        # "false" here would wave the change through on a broken analyzer.
        verdict=$(jq -r '.verdict // empty' "$report" 2>/dev/null) || verdict=''
        case "$code:$verdict" in
          0:no-review)       echo "requires-review=false" >> "$GITHUB_OUTPUT" ;;
          1:review-required) echo "requires-review=true" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::lgtm failed (exit code $code, verdict '${verdict:-none}')" ;;
        esac

        [ -f "$report" ] || printf '' > "$report"
        {
          echo "report<<LGTM_REPORT_EOF"
          cat "$report"
          echo "LGTM_REPORT_EOF"
        } >> "$GITHUB_OUTPUT"

    # Only consulted when review is required: a trivial PR should not go red
    # because someone left a nitpick on it.
    - name: 'Check for a qualifying approval'
      id: approval
      if: ${{ github.event.pull_request.number && steps.evaluate.outputs.requires-review == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -uo pipefail

        reviews="$RUNNER_TEMP/lgtm-reviews.json"
        if ! gh api "repos/$REPO/pulls/$PR/reviews" --paginate > "$reviews"; then
          echo "::warning::could not read reviews (needs pull-requests: read); treating as unapproved"
          echo "approved=false" >> "$GITHUB_OUTPUT"
          echo "changes-requested=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # A review counts only from someone with write access: on a public
        # repository anyone can leave an approving review. Failing to look a
        # reviewer up means their review does not count.
        writers='[]'
        for login in $(jq -r '[ .[] | .user.login ] | unique | .[]' "$reviews"); do
          permission=$(gh api "repos/$REPO/collaborators/$login/permission" --jq '.permission' 2>/dev/null) || permission=''
          case "$permission" in
            admin|write) writers=$(jq -c --arg l "$login" '. + [$l]' <<< "$writers") ;;
          esac
        done

        # Keep only reviews that carry a verdict, reduce to each reviewer's
        # most recent one, and judge on those. Without the per-author
        # reduction a reviewer who approves and later requests changes would
        # still read as approving. DISMISSED is retained so that a dismissed
        # approval correctly stops counting. An approval vouches for one
        # commit, so one left before the latest push reads as STALE; a request
        # for changes stands until its author withdraws it.
        states=$(jq -r --arg head "$HEAD_SHA" --argjson writers "$writers" '
          [ .[] | select(.state == "APPROVED"
                      or .state == "CHANGES_REQUESTED"
                      or .state == "DISMISSED")
                | select(.user.login as $u | $writers | index($u)) ]
          | group_by(.user.login)
          | map(max_by(.id))
          | map(if .state == "APPROVED" and .commit_id != $head then "STALE" else .state end)
          | .[]
        ' "$reviews")

        approved=false
        changes_requested=false
        for state in $states; do
          case "$state" in
            APPROVED) approved=true ;;
            CHANGES_REQUESTED) changes_requested=true ;;
          esac
        done

        echo "approved=$approved" >> "$GITHUB_OUTPUT"
        echo "changes-requested=$changes_requested" >> "$GITHUB_OUTPUT"
        echo "approved=$approved changes_requested=$changes_requested"

    # always(): a check run must be published on every path, including a failed
    # build. A required check that is never posted blocks the PR forever.
    - name: 'Publish check run'
      id: check
      if: ${{ always() && github.event.pull_request.number && inputs.check-name != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        CHECK_NAME: ${{ inputs.check-name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REQUIRES_REVIEW: ${{ steps.evaluate.outputs.requires-review }}
        EXIT_CODE: ${{ steps.evaluate.outputs.exit-code }}
        APPROVED: ${{ steps.approval.outputs.approved }}
        CHANGES_REQUESTED: ${{ steps.approval.outputs.changes-requested }}
      run: |
        set -uo pipefail

        # Branch protection evaluates checks against the PR head commit. The
        # merge commit in github.sha produces a check run that shows in the UI
        # and is ignored by the merge gate, so refuse rather than guess.
        if [ -z "$HEAD_SHA" ]; then
          echo "::error::no pull request head SHA available; cannot publish '$CHECK_NAME'"
          exit 1
        fi

        if [ "$IS_FORK" = "true" ]; then
          echo "::warning::pull requests from forks get a read-only token, so the '$CHECK_NAME' check cannot be published. Fork PRs are unsupported; see docs/action.md."
        fi

        if [ "$REQUIRES_REVIEW" = "true" ]; then
          if [ "$CHANGES_REQUESTED" = "true" ]; then
            state=changes-requested
          elif [ "$APPROVED" = "true" ]; then
            state=approved
          else
            state=awaiting
          fi
        elif [ "$REQUIRES_REVIEW" = "false" ]; then
          state=not-required
        else
          state=failed
        fi

        summary="$RUNNER_TEMP/lgtm-summary.md"
        case "$state" in
          not-required)
            conclusion=success
            title='No review required'
            echo 'This change is below the review thresholds.' > "$summary"
            ;;
          approved)
            conclusion=success
            title='Review required — approved'
            {
              echo 'This change is above the review thresholds, **and it has been approved**.'
              echo
              echo 'The check is green because a human vouched for the change, not because'
              echo 'the change is simple. A green check here means "either simple, or reviewed".'
            } > "$summary"
            ;;
          awaiting)
            conclusion=failure
            title='Review required — awaiting approval'
            {
              echo 'This change is above the review thresholds and has no approving review yet.'
              echo
              echo 'The check clears itself: it turns green as soon as someone with write'
              echo 'access approves the latest commit. No re-run is needed.'
            } > "$summary"
            ;;
          changes-requested)
            conclusion=failure
            title='Changes requested'
            {
              echo 'This change is above the review thresholds and a reviewer has requested'
              echo 'changes. Approvals resume counting once the request is resolved or dismissed.'
            } > "$summary"
            ;;
          failed)
            conclusion=failure
            title='Analysis failed — could not evaluate'
            {
              echo "lgtm did not produce a verdict (exit code: ${EXIT_CODE:-none})."
              echo
              echo 'This is a tool failure, not a statement about the change.'
              echo 'The check fails closed so a broken analyzer cannot wave a PR through.'
            } > "$summary"
            ;;
        esac

        report="$RUNNER_TEMP/lgtm-report.json"
        [ -s "$report" ] || printf '' > "$report"

        if jq -e . "$report" >/dev/null 2>&1; then
          jq -r '
            def th: if . == null then "off" else tostring end;
            def sc: if . == null then "unavailable" else tostring end;
            def fired($r): if (.reasons // [] | index($r)) then "**yes**" else "" end;
            def where: if .file then "`\(.file)\(if .line then ":\(.line)" else "" end)`" else empty end;
            def who: if .symbol then "`\(.symbol)`" else empty end;
            def amount: (.value // .level) | if . == null then empty else "(\(.))" end;
            def item: [who, where, amount] | join(" ");
            "",
            "| Measure | Score | Threshold | Requires review |",
            "| --- | --- | --- | --- |",
            "| Files with substantive changes | \(.scores.breadthFiles) | \(.gate.thetaBreadth | th) | \(fired("breadth-files")) |",
            "| Modules touched | \(.scores.breadthModules | sc) | \(.gate.thetaModules | th) | \(fired("breadth-modules")) |",
            "| Lines added | \(.scores.linesAdded) | \(.gate.thetaLines | th) | \(fired("lines-added")) |",
            "| Uncovered files | \(.scores.uncoveredFiles) | \(.gate.thetaUncovered | th) | \(fired("uncovered-files")) |",
            "| Cognitive complexity increase | \(.scores.cogDelta | sc) | \(.gate.thetaCog | th) | \(fired("cog-delta")) |",
            "| New-function complexity | \(.scores.newFunctionComplexity | sc) | \(.gate.thetaNewFunction | th) | \(fired("new-function-complexity")) |",
            "| Significance | \(.scores.significance | sc) | \(.gate.thetaSignificance | th) | \(fired("significance")) |",
            "| Significance of changes with callers | \(.scores.calledSignificance | sc) | high, while significance is on | \(fired("called-exported-signature")) |",
            "| Blast radius | \(.scores.blastRadius | sc) | \(.gate.thetaBlast | th) | \(fired("blast-radius")) |",
            "| Edit depth | \(.scores.editDepth) | \(.gate.thetaDepth | th) | \(fired("edit-depth")) |",
            "| New-code depth | \(.scores.newDepth) | never gated | |",
            "",
            "Unparsed files: \(.facts.unparsed). Changed an always-review path: \(.facts.alwaysReview). Either one always requires review.",
            ( if (.overrides // [] | length) > 0 then "", "Path overrides applied: \(.overrides | join(", "))." else empty end ),
            "",
            ( [ .contributors // {} | to_entries[] | select(.value | length > 0) ] as $c
              | if ($c | length) > 0 then
                  "**What drove the scores**",
                  "",
                  ( $c[] | "- `\(.key)`: " + ( .value[:10] | map(item) | join(", ") ) ),
                  ""
                else empty end ),
            "\(.files | length) file(s) changed."
          ' "$report" >> "$summary"

          # Parse errors, then the places behind every rule that fired. A place
          # that no longer exists on the head side cannot carry an annotation.
          annotations=$(jq -c '
            def source: {
              "edit-depth": "editDepth", "cog-delta": "cogDelta",
              "new-function-complexity": "newFunctionComplexity",
              "significance": "significance", "called-exported-signature": "significance",
              "blast-radius": "blastRadius", "lines-added": "linesAdded",
              "uncovered-files": "uncoveredFiles", "always-review": "alwaysReview"
            };
            . as $r
            | [ $r.files // [] | .[] | select(.kind == "delete") | .path ] as $gone
            | [ $r.parseErrors // [] | .[] | {
                  path: .path,
                  start_line: 1,
                  end_line: 1,
                  annotation_level: "failure",
                  title: "Unparseable file",
                  message: "lgtm could not parse this file on the \(.side) side: \(.reason). An unparseable tree always requires review."
                } ]
              + [ ($r.reasons // [] | map(source[.] // empty) | unique)[] as $k
                  | ($r.contributors[$k] // [])[]
                  | select(.file and (.deleted | not) and (.file as $f | $gone | index($f) | not))
                  | {
                      path: .file,
                      start_line: (.line // 1),
                      end_line: (.line // 1),
                      annotation_level: "warning",
                      title: "lgtm: \($k)",
                      message: ("This is behind the \($k) score"
                        + (if .symbol then ": \(.symbol)" else "" end)
                        + ((.value // .level) | if . == null then "" else " (\(.))" end) + ".")
                    } ]
            | .[0:50]
          ' "$report")

          # The Checks API caps output.text at 64KB and rejects the whole
          # check run if it is exceeded - which would leave the PR with no
          # check at all, the one outcome this action must never produce.
          if [ "$(wc -c < "$report")" -gt 60000 ]; then
            text='The full report is too large to embed here; see the job log linked above.'
          else
            text=$(jq -rn --rawfile r "$report" '
              "<details><summary>Full lgtm report</summary>\n\n```json\n" + $r + "\n```\n\n</details>"
            ')
          fi
        else
          annotations='[]'
          text=''
        fi

        payload="$RUNNER_TEMP/lgtm-check.json"
        jq -n \
          --arg name "$CHECK_NAME" \
          --arg conclusion "$conclusion" \
          --arg details_url "$DETAILS_URL" \
          --arg title "$title" \
          --rawfile summary "$summary" \
          --arg text "$text" \
          --argjson annotations "$annotations" \
          '{
            name: $name,
            status: "completed",
            conclusion: $conclusion,
            details_url: $details_url,
            output: {
              title: $title,
              summary: $summary,
              text: $text,
              annotations: $annotations
            }
          }' > "$payload"

        echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
        echo "state=$state" >> "$GITHUB_OUTPUT"
        echo "publishing '$CHECK_NAME' as $conclusion ($title) on $HEAD_SHA"

        # Reuse the run for this SHA so repeated evaluations (a push, then an
        # approval) update one entry instead of stacking duplicates.
        encoded=$(jq -rn --arg n "$CHECK_NAME" '$n|@uri')
        existing=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=$encoded" \
          --jq '.check_runs[0].id // empty' 2>/dev/null) || existing=''

        if [ -n "$existing" ]; then
          ok=$(gh api -X PATCH "repos/$REPO/check-runs/$existing" --input "$payload" --silent && echo yes || echo no)
        else
          jq --arg sha "$HEAD_SHA" '. + {head_sha: $sha}' "$payload" > "$payload.new"
          mv "$payload.new" "$payload"
          ok=$(gh api -X POST "repos/$REPO/check-runs" --input "$payload" --silent && echo yes || echo no)
        fi

        if [ "$ok" != "yes" ]; then
          echo "::warning::could not publish the '$CHECK_NAME' check run. The workflow needs 'checks: write', and pull requests from forks cannot publish checks at all."
        fi

    - name: 'Flag the pull request'
      if: ${{ github.event.pull_request.number && (inputs.label != '' || inputs.request-reviewers != '') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REQUIRES_REVIEW: ${{ steps.evaluate.outputs.requires-review }}
        LABEL: ${{ inputs.label }}
        REVIEWERS: ${{ inputs.request-reviewers }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        # The label tracks whether the change is complex, not whether it is
        # currently blocked, so an approved PR keeps it. Enforcement is the
        # check run's job.
        if [ "$REQUIRES_REVIEW" != "true" ]; then
          # Clear a stale label so a PR that shrinks stops being flagged.
          if [ -n "$LABEL" ]; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/$LABEL" --silent 2>/dev/null \
              && echo "removed label '$LABEL'" \
              || echo "label '$LABEL' was not present"
          fi
          exit 0
        fi

        if [ -n "$LABEL" ]; then
          gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=$LABEL" --silent \
            && echo "added label '$LABEL'" \
            || echo "::warning::could not add label '$LABEL' (needs pull-requests: write)"
        fi

        if [ -n "$REVIEWERS" ]; then
          args=()
          IFS=',' read -ra requested <<< "$REVIEWERS"
          for r in "${requested[@]}"; do
            r="$(echo "$r" | tr -d '[:space:]')"
            [ -z "$r" ] && continue
            case "$r" in
              */*) args+=(-f "team_reviewers[]=${r#*/}") ;;
              *)   args+=(-f "reviewers[]=$r") ;;
            esac
          done
          if [ "${#args[@]}" -gt 0 ]; then
            # A 422 here usually means the reviewer is the PR author or is
            # already requested; neither is worth failing the run over.
            gh api "repos/$REPO/pulls/$PR/requested_reviewers" "${args[@]}" --silent \
              && echo "requested review from: $REVIEWERS" \
              || echo "::warning::could not request reviewers ($REVIEWERS)"
          fi
        fi

    # The job is red only when lgtm itself broke. A change that requires review
    # is reported by the check run, which keeps the two signals distinct.
    - name: 'Report tool failure'
      if: ${{ always() && steps.evaluate.outputs.requires-review == '' }}
      shell: bash
      env:
        EXIT_CODE: ${{ steps.evaluate.outputs.exit-code }}
      run: |
        echo "::error::lgtm did not produce a verdict (exit code: ${EXIT_CODE:-none})"
        exit 1
