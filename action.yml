name: 'lgtm'
description: 'Compare base vs head source trees and decide whether the PR requires review.'
inputs:
  base:
    description: >-
      Path to the base (pre-PR) source tree. Must be an already-resolved path:
      use ${{ runner.temp }}/... rather than "$RUNNER_TEMP/...", as the value is
      passed to the tool verbatim and is not expanded by a shell.
    required: true
  head:
    description: >-
      Path to the head (post-PR) source tree, normally ${{ github.workspace }}.
      Must be an already-resolved path; see "base".
    required: true
  theta-depth:
    description: 'High depth threshold (default 7).'
    required: false
    default: '7'
  theta-breadth:
    description: 'High breadth threshold (default 6).'
    required: false
    default: '6'
  epsilon-trivial:
    description: 'Trivial-depth upper bound (default 1).'
    required: false
    default: '1'
  trust-mode:
    description: >-
      How the trusted-contributor exemption is decided: "none" (nobody is
      exempt), "top-percent" or "top-count" (ranked by all-time commit count
      from the contributors API), or "codeowners" (the author owns at least one
      changed file). Exactly one mode applies.
    required: false
    default: 'none'
  trust-percent:
    description: >-
      Percentile cutoff for trust-mode "top-percent". Rounds up, so the top 20%
      of three contributors is one person. Contributors tied with the last one
      inside the cut are also included.
    required: false
    default: '20'
  trust-count:
    description: 'Rank cutoff for trust-mode "top-count". Ties at the cutoff are included.'
    required: false
    default: '10'
  author:
    description: >-
      Login of the pull request author. Defaults to the PR author rather than
      github.actor, which on a pull_request_review event is the reviewer.
    required: false
    default: ${{ github.event.pull_request.user.login }}
  check-name:
    description: >-
      Name of the check run this action publishes. This is the exact string you
      mark as a required status check in branch protection, so renaming it
      silently un-requires the old one. Empty disables publishing the check.
    required: false
    default: 'LGTM / review-gate'
  label:
    description: >-
      Label to add to the pull request when review is required, and to remove
      when it is not. Routing only - the merge gate is the check run. Empty
      disables labelling.
    required: false
    default: ''
  request-reviewers:
    description: >-
      Comma-separated reviewers to request when review is required. A plain
      login requests a user; "org/team" requests a team.
    required: false
    default: ''
  github-token:
    description: >-
      Token used to publish the check run, read reviews, label the PR and
      request reviewers. Needs checks: write and pull-requests: write.
    required: false
    default: ${{ github.token }}

outputs:
  requires-review:
    description: >-
      '"true" when the change requires human review, "false" otherwise. Empty
      when lgtm could not run - test for "true" explicitly, since an empty
      value compared against "false" reads as "not required".'
    value: ${{ steps.evaluate.outputs.requires-review }}
  check-conclusion:
    description: >-
      '"success" or "failure" - the conclusion published to the check run. It is
      "failure" both when review is required without approval and when lgtm
      itself failed. Empty when no check was published: outside a pull request,
      or with check-name disabled.'
    value: ${{ steps.check.outputs.conclusion }}
  report:
    description: 'The full lgtm JSON report. Empty when lgtm could not run.'
    value: ${{ steps.evaluate.outputs.report }}

runs:
  using: 'composite'
  steps:
    - name: 'Build lgtm'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$GITHUB_ACTION_PATH/bin/lgtm" ./cmd/lgtm

    # Resolves the trusted-contributor exemption before lgtm runs, since lgtm
    # takes only the resulting bool. Every failure path here degrades to "not
    # trusted" with a warning: the safe direction is an extra review, never a
    # silent exemption.
    - name: 'Resolve trusted contributor'
      id: trust
      if: ${{ inputs.trust-mode != 'none' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_DIR: ${{ inputs.head }}
        MODE: ${{ inputs.trust-mode }}
        AUTHOR: ${{ inputs.author }}
        TRUST_PERCENT: ${{ inputs.trust-percent }}
        TRUST_COUNT: ${{ inputs.trust-count }}
      run: |
        set -uo pipefail

        # Ranks contributors by all-time commit count and reports whether the
        # author falls inside the cut. $mode is top-percent or top-count.
        #
        # The cutoff rounds UP so a mode the user explicitly enabled is not
        # silently inert on a small repo, and it expands to include everyone
        # tied with the last contributor inside it - neither the contributors
        # API nor git shortlog specifies tie ordering, and a merge gate must
        # not flip on an unspecified sort.
        # shellcheck disable=SC2016  # $author/$mode/$value are jq variables, not shell
        rank_filter='
          [ .[] | select(.type == "User") ]
          | sort_by(-.contributions, (.login | ascii_downcase))
          | . as $ranked
          | ($ranked | length) as $n
          | ($author | ascii_downcase) as $who
          | (if $n == 0 then 0
             elif $mode == "top-count" then (if $value > $n then $n else $value end)
             elif $value <= 0 then 0
             elif $value >= 100 then $n
             else (((($n * $value) + 99) / 100) | floor)
             end) as $k
          | (if $k <= 0 then 0
             elif $k >= $n then $n
             else ($ranked[$k - 1].contributions) as $edge
                  | ([ $ranked[] | select(.contributions >= $edge) ] | length)
             end) as $cut
          | ([ $ranked[] | .login | ascii_downcase ] | index($who)) as $idx
          | { trusted: ($cut > 0 and $idx != null and $idx < $cut),
              rank: (if $idx == null then 0 else $idx + 1 end),
              cutoff: $cut,
              contributors: $n }
        '

        # Parses CODEOWNERS text and reports which changed paths the author
        # owns. Ownership is LAST MATCHING RULE WINS: given "* @alice" then
        # "*.go @bob", the owner of x.go is bob alone. Treating any matching
        # rule as ownership would trust alice for every Go file, which is
        # exactly the over-trust this gate must not produce.
        #
        # Glob support is the documented subset: * within a segment, ? single
        # char, ** across segments, a leading / or any embedded / anchors at
        # the repo root, a trailing / means the directory and everything under
        # it, and a pattern with no / matches a basename at any depth.
        # shellcheck disable=SC2016  # $text/$paths/$author/$teams are jq variables, not shell
        codeowners_filter='
          def esc: gsub("(?<c>[.+^$(){}|\\[\\]\\\\])"; "\\" + .c);
          def glob2re:
            esc
            | gsub("/\\*\\*/"; "\u0001")
            | gsub("\\*\\*"; "\u0000")
            | gsub("\\*"; "[^/]*")
            | gsub("\\?"; "[^/]")
            | gsub("\u0000"; ".*")
            | gsub("\u0001"; "/(?:.*/)?");
          def rule_re($p):
            ($p | endswith("/")) as $isdir
            | ($p | sub("^/"; "") | sub("/$"; "")) as $body
            | ($body | test("/")) as $anchored
            | ($body | glob2re) as $re
            | if $isdir then "^" + $re + "/.*$"
              elif $anchored then "^" + $re + "$"
              else "^(?:.*/)?" + $re + "$"
              end;
          def owner_matches($o):
            ($o | ascii_downcase) as $lo
            | ($lo == ("@" + ($author | ascii_downcase)))
              or (($teams[$lo] // []) | index($author | ascii_downcase)) != null;
          ($text | split("\n")
            | map(sub("#.*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; ""))
            | map(select(length > 0))
            | map(select(startswith("[") or startswith("^[") or startswith("!") | not))
            | map(split("\\s+"; "") | map(select(length > 0)))
            | map(select(length > 0))
            | map({ pattern: .[0], re: rule_re(.[0]), owners: .[1:] })
          ) as $rules
          | [ $paths[]
              | . as $path
              | ([ $rules[] | . as $r | select($path | test($r.re)) ] | last) as $rule
              | select($rule != null and ([ $rule.owners[] | select(owner_matches(.)) ] | length) > 0)
              | $path ] as $owned
          | { trusted: ($owned | length > 0),
              ownedFiles: $owned,
              rules: ($rules | length) }
        '

        trusted=false
        reason=""

        if [ -z "$AUTHOR" ]; then
          echo "::warning::no pull request author available; treating as not trusted"
          {
            echo "trusted=false"
            echo "reason=no author available"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        case "$MODE" in
          top-percent|top-count)
            if [ "$MODE" = "top-percent" ]; then value="$TRUST_PERCENT"; else value="$TRUST_COUNT"; fi

            contributors="$RUNNER_TEMP/lgtm-contributors.json"
            # --paginate emits one array per page, so stream the elements and
            # slurp them back into a single array.
            if gh api "repos/$REPO/contributors?per_page=100" --paginate --jq '.[]' \
                 | jq -s '.' > "$contributors" && [ -s "$contributors" ]; then
              if result=$(jq -c --arg author "$AUTHOR" --arg mode "$MODE" --argjson value "$value" \
                   "$rank_filter" "$contributors"); then
                trusted=$(echo "$result" | jq -r '.trusted')
                reason=$(echo "$result" | jq -r '
                  if .rank == 0 then "author is not among the \(.contributors) ranked contributors"
                  else "rank \(.rank) of \(.contributors); the cut covers \(.cutoff)" end')
              else
                echo "::warning::could not rank contributors; treating as not trusted"
                reason="contributor ranking failed"
              fi
            else
              echo "::warning::could not read the contributors API; treating as not trusted"
              reason="contributors API unavailable"
            fi
            ;;

          codeowners)
            file=""
            for candidate in .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS; do
              if [ -f "$HEAD_DIR/$candidate" ]; then file="$candidate"; break; fi
            done

            if [ -z "$file" ]; then
              echo "::warning::no CODEOWNERS file in the head tree; treating as not trusted"
              reason="no CODEOWNERS file found"
            else
              # The PR's real file list, not lgtm's files[] - lgtm only reports
              # files it could parse, so ownership over .md or .yml paths would
              # be invisible to it.
              paths="$RUNNER_TEMP/lgtm-changed.json"
              if ! gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
                   | jq -Rs 'split("\n") | map(select(length > 0))' > "$paths"; then
                echo "::warning::could not list the pull request files; treating as not trusted"
                reason="could not list changed files"
              else
                # Expand any @org/team named in the file, so team ownership
                # works as written. Needs read:org, which the default token
                # lacks for org teams - hence the warning rather than silence.
                teams='{}'
                # shellcheck disable=SC2013  # the pattern admits no whitespace, so word splitting is correct
                for team in $(grep -oE '@[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' "$HEAD_DIR/$file" | sort -u); do
                  org="${team#@}"; org="${org%%/*}"
                  slug="${team##*/}"
                  if members=$(gh api "orgs/$org/teams/$slug/members" --paginate --jq '.[].login' 2>/dev/null); then
                    teams=$(echo "$teams" | jq -c --arg k "$(echo "$team" | tr '[:upper:]' '[:lower:]')" \
                      --argjson v "$(printf '%s' "$members" | jq -Rs 'split("\n") | map(select(length > 0) | ascii_downcase)')" \
                      '. + {($k): $v}')
                  else
                    echo "::warning::could not expand $team (needs read:org); its members are not trusted"
                    unresolved="${unresolved:-}$team "
                  fi
                done

                if result=$(jq -n -c --arg author "$AUTHOR" --argjson teams "$teams" \
                     --rawfile text "$HEAD_DIR/$file" --argjson paths "$(cat "$paths")" \
                     "$codeowners_filter"); then
                  trusted=$(echo "$result" | jq -r '.trusted')
                  reason=$(echo "$result" | jq -r '"author owns \(.ownedFiles | length) changed file(s) per '"$file"'"')
                else
                  echo "::warning::could not evaluate CODEOWNERS; treating as not trusted"
                  reason="CODEOWNERS evaluation failed"
                fi
                if [ -n "${unresolved:-}" ]; then
                  reason="$reason; unresolved teams: ${unresolved% }"
                fi
              fi
            fi
            ;;

          *)
            echo "::error::unknown trust-mode '$MODE' (expected none, top-percent, top-count or codeowners)"
            exit 1
            ;;
        esac

        # Anything other than a literal "true" is not trust. This is the last
        # line of defence against an empty or malformed intermediate result
        # reaching the gate as something truthy.
        [ "$trusted" = "true" ] || trusted=false

        echo "trust-mode=$MODE trusted=$trusted ($reason)"
        {
          echo "trusted=$trusted"
          echo "reason=$reason"
        } >> "$GITHUB_OUTPUT"

    # Records the decision without ever exiting non-zero, so the check run is
    # still published when lgtm fails. The job's own failure is decided by the
    # final step instead.
    - name: 'Evaluate review complexity'
      id: evaluate
      shell: bash
      env:
        LGTM_BASE: ${{ inputs.base }}
        LGTM_HEAD: ${{ inputs.head }}
        LGTM_THETA_DEPTH: ${{ inputs.theta-depth }}
        LGTM_THETA_BREADTH: ${{ inputs.theta-breadth }}
        LGTM_EPSILON_TRIVIAL: ${{ inputs.epsilon-trivial }}
        LGTM_TRUSTED_INPUT: ${{ steps.trust.outputs.trusted == 'true' }}
      run: |
        set -uo pipefail

        report=$("$GITHUB_ACTION_PATH/bin/lgtm" \
          --base "$LGTM_BASE" \
          --head "$LGTM_HEAD" \
          --theta-depth "$LGTM_THETA_DEPTH" \
          --theta-breadth "$LGTM_THETA_BREADTH" \
          --epsilon-trivial "$LGTM_EPSILON_TRIVIAL" \
          --trusted="$LGTM_TRUSTED_INPUT") && code=0 || code=$?

        echo "$report"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        case "$code" in
          0) echo "requires-review=false" >> "$GITHUB_OUTPUT" ;;
          1) echo "requires-review=true" >> "$GITHUB_OUTPUT" ;;
          # Deliberately left unset: we have no verdict, and claiming "false"
          # here would wave the change through on a broken analyzer.
          *) echo "::error::lgtm failed with exit code $code" ;;
        esac

        # Stash the report for the check-run step; $GITHUB_OUTPUT is not a
        # reliable carrier for multi-line JSON containing arbitrary paths.
        printf '%s' "$report" > "$RUNNER_TEMP/lgtm-report.json"
        {
          echo "report<<LGTM_REPORT_EOF"
          echo "$report"
          echo "LGTM_REPORT_EOF"
        } >> "$GITHUB_OUTPUT"

    # Only consulted when review is required: a trivial PR should not go red
    # because someone left a nitpick on it.
    - name: 'Check for a qualifying approval'
      id: approval
      if: ${{ github.event.pull_request.number && steps.evaluate.outputs.requires-review == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -uo pipefail

        reviews="$RUNNER_TEMP/lgtm-reviews.json"
        if ! gh api "repos/$REPO/pulls/$PR/reviews" --paginate > "$reviews"; then
          echo "::warning::could not read reviews (needs pull-requests: read); treating as unapproved"
          echo "approved=false" >> "$GITHUB_OUTPUT"
          echo "changes-requested=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Keep only reviews that carry a verdict, reduce to each reviewer's
        # most recent one, and judge on those. Without the per-author
        # reduction a reviewer who approves and later requests changes would
        # still read as approving. DISMISSED is retained so that a dismissed
        # approval correctly stops counting.
        states=$(jq -r '
          [ .[] | select(.state == "APPROVED"
                      or .state == "CHANGES_REQUESTED"
                      or .state == "DISMISSED") ]
          | group_by(.user.login)
          | map(max_by(.id).state)
          | .[]
        ' "$reviews")

        approved=false
        changes_requested=false
        for state in $states; do
          case "$state" in
            APPROVED) approved=true ;;
            CHANGES_REQUESTED) changes_requested=true ;;
          esac
        done

        echo "approved=$approved" >> "$GITHUB_OUTPUT"
        echo "changes-requested=$changes_requested" >> "$GITHUB_OUTPUT"
        echo "approved=$approved changes_requested=$changes_requested"

    # always(): a check run must be published on every path, including a failed
    # build. A required check that is never posted blocks the PR forever.
    - name: 'Publish check run'
      id: check
      if: ${{ always() && github.event.pull_request.number && inputs.check-name != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        CHECK_NAME: ${{ inputs.check-name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REQUIRES_REVIEW: ${{ steps.evaluate.outputs.requires-review }}
        EXIT_CODE: ${{ steps.evaluate.outputs.exit-code }}
        TRUST_MODE: ${{ inputs.trust-mode }}
        TRUST_REASON: ${{ steps.trust.outputs.reason }}
        APPROVED: ${{ steps.approval.outputs.approved }}
        CHANGES_REQUESTED: ${{ steps.approval.outputs.changes-requested }}
      run: |
        set -uo pipefail

        # Branch protection evaluates checks against the PR head commit. The
        # merge commit in github.sha produces a check run that shows in the UI
        # and is ignored by the merge gate, so refuse rather than guess.
        if [ -z "$HEAD_SHA" ]; then
          echo "::error::no pull request head SHA available; cannot publish '$CHECK_NAME'"
          exit 1
        fi

        if [ "$IS_FORK" = "true" ]; then
          echo "::warning::pull requests from forks get a read-only token, so the '$CHECK_NAME' check cannot be published. Fork PRs are unsupported; see the README."
        fi

        if [ "$REQUIRES_REVIEW" = "true" ]; then
          if [ "$CHANGES_REQUESTED" = "true" ]; then
            state=changes-requested
          elif [ "$APPROVED" = "true" ]; then
            state=approved
          else
            state=awaiting
          fi
        elif [ "$REQUIRES_REVIEW" = "false" ]; then
          state=not-required
        else
          state=failed
        fi

        summary="$RUNNER_TEMP/lgtm-summary.md"
        case "$state" in
          not-required)
            conclusion=success
            title='No review required'
            echo 'This change is below the review thresholds.' > "$summary"
            ;;
          approved)
            conclusion=success
            title='Review required — approved'
            {
              echo 'This change is above the review thresholds, **and it has been approved**.'
              echo
              echo 'The check is green because a human vouched for the change, not because'
              echo 'the change is simple. A green check here means "either simple, or reviewed".'
            } > "$summary"
            ;;
          awaiting)
            conclusion=failure
            title='Review required — awaiting approval'
            {
              echo 'This change is above the review thresholds and has no approving review yet.'
              echo
              echo 'The check clears itself: it turns green as soon as someone approves the'
              echo 'pull request. No re-run is needed.'
            } > "$summary"
            ;;
          changes-requested)
            conclusion=failure
            title='Changes requested'
            {
              echo 'This change is above the review thresholds and a reviewer has requested'
              echo 'changes. Approvals resume counting once the request is resolved or dismissed.'
            } > "$summary"
            ;;
          failed)
            conclusion=failure
            title='Analysis failed — could not evaluate'
            {
              echo "lgtm did not produce a verdict (exit code: ${EXIT_CODE:-none})."
              echo
              echo 'This is a tool failure, not a statement about the change.'
              echo 'The check fails closed so a broken analyzer cannot wave a PR through.'
            } > "$summary"
            ;;
        esac

        report="$RUNNER_TEMP/lgtm-report.json"
        [ -s "$report" ] || printf '' > "$report"

        if jq -e . "$report" >/dev/null 2>&1; then
          jq -r '
            "",
            "| Metric | Value | Threshold |",
            "| --- | --- | --- |",
            "| Depth (modified) | \(.metrics.DepthMod) | θ_depth \(.thresholds.ThetaDepth) |",
            "| Breadth | \(.metrics.Breadth) | θ_breadth \(.thresholds.ThetaBreadth) |",
            "| Depth (total) | \(.metrics.DepthTotal) | ε_trivial \(.thresholds.EpsilonTrivial) |",
            "| Depth (new code) | \(.metrics.DepthNew) | not consulted |",
            "| Trusted contributor | \(.metrics.Trusted) | exempts review |",
            "| Unparsed files | \(.metrics.Unparsed) | forces review |",
            "",
            "\(.files | length) file(s) changed."
          ' "$report" >> "$summary"

          # Without this, a change waved through by the exemption looks
          # identical to one that was simply below the thresholds.
          if [ "$TRUST_MODE" != "none" ]; then
            {
              echo
              echo "Trust mode \`$TRUST_MODE\`: ${TRUST_REASON:-not resolved}."
            } >> "$summary"
          fi

          annotations=$(jq -c '
            [ .parseErrors // [] | .[] | {
                path: .path,
                start_line: 1,
                end_line: 1,
                annotation_level: "failure",
                title: "Unparseable file",
                message: "lgtm could not parse this file on the \(.side) side: \(.reason). An unparseable tree always requires review."
              } ] | .[0:50]
          ' "$report")

          # The Checks API caps output.text at 64KB and rejects the whole
          # check run if it is exceeded - which would leave the PR with no
          # check at all, the one outcome this action must never produce.
          if [ "$(wc -c < "$report")" -gt 60000 ]; then
            text='The full report is too large to embed here; see the job log linked above.'
          else
            text=$(jq -rn --rawfile r "$report" '
              "<details><summary>Full lgtm report</summary>\n\n```json\n" + $r + "\n```\n\n</details>"
            ')
          fi
        else
          annotations='[]'
          text=''
        fi

        payload="$RUNNER_TEMP/lgtm-check.json"
        jq -n \
          --arg name "$CHECK_NAME" \
          --arg conclusion "$conclusion" \
          --arg details_url "$DETAILS_URL" \
          --arg title "$title" \
          --rawfile summary "$summary" \
          --arg text "$text" \
          --argjson annotations "$annotations" \
          '{
            name: $name,
            status: "completed",
            conclusion: $conclusion,
            details_url: $details_url,
            output: {
              title: $title,
              summary: $summary,
              text: $text,
              annotations: $annotations
            }
          }' > "$payload"

        echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
        echo "state=$state" >> "$GITHUB_OUTPUT"
        echo "publishing '$CHECK_NAME' as $conclusion ($title) on $HEAD_SHA"

        # Reuse the run for this SHA so repeated evaluations (a push, then an
        # approval) update one entry instead of stacking duplicates.
        encoded=$(jq -rn --arg n "$CHECK_NAME" '$n|@uri')
        existing=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=$encoded" \
          --jq '.check_runs[0].id // empty' 2>/dev/null) || existing=''

        if [ -n "$existing" ]; then
          ok=$(gh api -X PATCH "repos/$REPO/check-runs/$existing" --input "$payload" --silent && echo yes || echo no)
        else
          jq --arg sha "$HEAD_SHA" '. + {head_sha: $sha}' "$payload" > "$payload.new"
          mv "$payload.new" "$payload"
          ok=$(gh api -X POST "repos/$REPO/check-runs" --input "$payload" --silent && echo yes || echo no)
        fi

        if [ "$ok" != "yes" ]; then
          echo "::warning::could not publish the '$CHECK_NAME' check run. The workflow needs 'checks: write', and pull requests from forks cannot publish checks at all."
        fi

    - name: 'Flag the pull request'
      if: ${{ github.event.pull_request.number && (inputs.label != '' || inputs.request-reviewers != '') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REQUIRES_REVIEW: ${{ steps.evaluate.outputs.requires-review }}
        LABEL: ${{ inputs.label }}
        REVIEWERS: ${{ inputs.request-reviewers }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        # The label tracks whether the change is complex, not whether it is
        # currently blocked, so an approved PR keeps it. Enforcement is the
        # check run's job.
        if [ "$REQUIRES_REVIEW" != "true" ]; then
          # Clear a stale label so a PR that shrinks stops being flagged.
          if [ -n "$LABEL" ]; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/$LABEL" --silent 2>/dev/null \
              && echo "removed label '$LABEL'" \
              || echo "label '$LABEL' was not present"
          fi
          exit 0
        fi

        if [ -n "$LABEL" ]; then
          gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=$LABEL" --silent \
            && echo "added label '$LABEL'" \
            || echo "::warning::could not add label '$LABEL' (needs pull-requests: write)"
        fi

        if [ -n "$REVIEWERS" ]; then
          args=()
          IFS=',' read -ra requested <<< "$REVIEWERS"
          for r in "${requested[@]}"; do
            r="$(echo "$r" | tr -d '[:space:]')"
            [ -z "$r" ] && continue
            case "$r" in
              */*) args+=(-f "team_reviewers[]=${r#*/}") ;;
              *)   args+=(-f "reviewers[]=$r") ;;
            esac
          done
          if [ "${#args[@]}" -gt 0 ]; then
            # A 422 here usually means the reviewer is the PR author or is
            # already requested; neither is worth failing the run over.
            gh api "repos/$REPO/pulls/$PR/requested_reviewers" "${args[@]}" --silent \
              && echo "requested review from: $REVIEWERS" \
              || echo "::warning::could not request reviewers ($REVIEWERS)"
          fi
        fi

    # The job is red only when lgtm itself broke. A change that requires review
    # is reported by the check run, which keeps the two signals distinct.
    - name: 'Report tool failure'
      if: ${{ always() && steps.evaluate.outputs.requires-review == '' }}
      shell: bash
      env:
        EXIT_CODE: ${{ steps.evaluate.outputs.exit-code }}
      run: |
        echo "::error::lgtm did not produce a verdict (exit code: ${EXIT_CODE:-none})"
        exit 1
